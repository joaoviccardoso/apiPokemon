<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="./css/import.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body class="body">
    
    <header class="cabecalho">
        <nav class="container__cabecalho">
            <a href="./index.html" class="botao btn-header d-flex align-items-center">
                <img src="./img/pokeball.png" alt="logo pokebola" width="50">
                <p class="fontTextos titulo-header">Home</p>
            </a>
            <a class="botao btn-header d-flex align-items-center" id="" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasWithBothOptions" aria-controls="offcanvasWithBothOptions">
                <img src="./img/bola-ultra.png" alt="bola-ultra" width="50">
                <p class="fontTextos titulo-header">Equipe</p>
            </a>
        </nav>
    </header>

    <aside class="aside__container__esquerdo d-flex align-items-center justify-content-center">
        <nav class="container__select aside-esquerda">
            <ul class="d-flex flex-column justify-content-center align-items-center gap-3 p-0 m-0">

                <li class="">
                    <img class="imgPokebola" id="24" src="./img/pikachu.png" alt="logo pokebola">
                </li>

                <li class="d-flex">
                    <input class="input__pesquisa" id="campoPesquisa" type="text" placeholder="Pesquisar pelo id ou nome.">
                    <button type="button" class="btn-pesquisar botao" id="btnBuscar">Pesquisar</button>
                </li>

                <li class="d-flex m-3">
                    <select class="form-select selectTipos" aria-label="Default select example">
                        <option selected>Pesquisar pelo Tipo</option>
                        <option value="grass">Grass</option>
                        <option value="fire">Fire</option>
                        <option value="water">Water</option>
                        <option value="flying">Flying</option>
                        <option value="poison">Poison</option>
                        <option value="bug">Bug</option>
                        <option value="normal">Normal</option>
                        <option value="electric">Electric</option>
                        <option value="ground">Ground</option>
                        <option value="fairy">Fairy</option>
                        <option value="fighting">Fighting</option>
                        <option value="psychic">Psychic</option>
                        <option value="rock">Rock</option>
                        <option value="steel">Steel</option>
                        <option value="ice">Ice</option>
                        <option value="ghost">Ghost</option>
                        <option value="dragon">Dragon</option>
                    </select>
         
                    <button type="button" class="btn-filtrar botao" id="btnFiltrar">Filtrar por tipo</button>
                </li>

                <li class="d-flex justify-content-center">
                    <button type="button" id="mudarCor" class="botao btn-mudarCor mx-3">Mudar Cor</button>
                    <a class="d-flex justify-content-center align-items-center botao btn-home" href="./index.html">
                        <p class="texto-botao-home m-0" style="color: white;">Home</p>
                    </a>  
                </li>

                <li class="minhas__redes d-flex align-items-center justify-content-center gap-3">
                    <div class="lista">
                        <a class="lista" href="https://www.instagram.com/joao__viccardoso/">
                            <img src="./img/instagram.png" alt="Instagram" width="25">
                            <h3 class="titulo__rede">Instagram</h3>
                        </a>
                    </div>
                    <div class="lista">
                        <a class="lista" href="https://www.linkedin.com/in/jo%C3%A3o-victor-da-silva-cardoso-b66315248/">
                            <img src="./img/linkedin.png" alt="Linkedin" width="25">
                            <h3 class="titulo__rede">Linkedin</h3>
                        </a>    
                    </div>
                    <div class="lista">
                        <a class="lista" href="https://github.com/joaoviccardoso">
                            <img src="./img/github.png" alt="Github" width="25">
                            <h3 class="titulo__rede">Github</h3>
                        </a>    
                    </div>
                </li>

            </ul>
        </nav>

        <div class="offcanvas offcanvas-start" data-bs-scroll="true" tabindex="-1" id="offcanvasWithBothOptions" aria-labelledby="offcanvasWithBothOptionsLabel">
            <div class="offcanvas-header">
              <h5 class="offcanvas-title fontTitulos" id="offcanvasWithBothOptionsLabel">Minha Equipe</h5>
              <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <ul class="offcanvas-body d-flex flex-column">
                
            </ul>
        </div>
    </aside>

    <main class="main-centro">
        <ul class="lista__pokedex">
            
        </ul>
    </main>

    <aside class="aside-direito">
       <img src="./img/image.png" alt="logo pokemon" class="logoPokemon">
    </aside>

    <script type="module" src="./js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
